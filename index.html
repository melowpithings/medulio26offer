<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Medulio — Oferta 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange:    #D4560A;
      --orange-lt: #F07030;
      --green:     #3A5C3A;
      --green-lt:  #5A8C5A;
      --cream:     #FAF5EE;
      --stone:     #C4A882;
      --dark:      #1C1A17;
      --text:      #3A3530;
      --radius:    14px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HERO ───────────────────────────────────── */
    .hero {
      position: relative;
      min-height: 52vw;
      max-height: 360px;
      background: var(--cream); /* color de respaldo si la foto no carga */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 20px 48px;
      overflow: hidden;
    }

    /* Foto o vídeo de fondo */
    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    /*
      Overlay blanquecino — ajusta el número (0.55) para más o menos efecto:
        0.3 = foto muy visible  |  0.75 = muy blanqueado
    */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(250,245,238,0.32) 0%,
        rgba(250,245,238,0.42) 60%,
        rgba(250,245,238,0.58) 100%
      );
      z-index: 1;
    }

    /* rock shapes */
    .hero::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0; right: 0;
      height: 56px;
      background: var(--cream);
      clip-path: ellipse(55% 100% at 50% 100%);
      z-index: 2;
    }

    .hero-badge {
      position: relative;
      z-index: 2;
      font-family: 'Jost', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--orange);
      background: rgba(212,86,10,0.08);
      border: 1px solid rgba(212,86,10,0.25);
      padding: 5px 14px;
      border-radius: 30px;
      margin-bottom: 14px;
      backdrop-filter: blur(4px);
    }

    .hero h1 {
      position: relative;
      z-index: 2;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-weight: 600;
      color: var(--dark);
      text-align: center;
      line-height: 1.1;
      letter-spacing: 0.01em;
    }

    .hero h1 span {
      color: var(--orange);
      font-style: italic;
    }
      color: var(--stone);
      font-style: italic;
    }

    .hero-sub {
      position: relative;
      z-index: 2;
      font-size: 13px;
      color: var(--green);
      margin-top: 10px;
      letter-spacing: 0.04em;
    }

    /* ── LANG SWITCHER ──────────────────────────── */
    .lang-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 20px 20px 4px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--stone);
      padding: 6px 14px;
      border-radius: 30px;
      border: 1.5px solid transparent;
      transition: all 0.2s;
    }

    .lang-btn.active {
      color: var(--orange);
      border-color: var(--orange);
      background: rgba(212,86,10,0.06);
    }

    /* ── SECTION ────────────────────────────────── */
    .section {
      padding: 0 16px 32px;
      max-width: 520px;
      margin: 0 auto;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.55rem;
      font-weight: 600;
      color: var(--green);
      text-align: center;
      margin: 28px 0 6px;
    }

    .section-sub {
      font-size: 12.5px;
      color: #888;
      text-align: center;
      margin-bottom: 22px;
      letter-spacing: 0.03em;
    }

    /* ── PRICE CARDS ────────────────────────────── */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 2px 18px rgba(58,53,48,0.07);
      display: flex;
      align-items: center;
      padding: 18px 20px;
      gap: 16px;
      border-left: 4px solid var(--orange);
      transition: transform 0.18s, box-shadow 0.18s;
      animation: fadeUp 0.5s ease both;
    }

    .card:nth-child(1) { animation-delay: 0.05s; border-color: var(--orange); }
    .card:nth-child(2) { animation-delay: 0.12s; border-color: var(--orange-lt); }
    .card:nth-child(3) { animation-delay: 0.19s; border-color: var(--green-lt); }
    .card:nth-child(4) { animation-delay: 0.26s; border-color: var(--green); }

    .card:active { transform: scale(0.98); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-icon {
      font-size: 26px;
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      background: var(--cream);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-body { flex: 1; }

    .card-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--dark);
      line-height: 1.2;
    }

    .card-desc {
      font-size: 11.5px;
      color: #999;
      margin-top: 2px;
      line-height: 1.35;
    }

    .card-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.7rem;
      font-weight: 600;
      color: var(--orange);
      white-space: nowrap;
    }

    .card-price sup {
      font-size: 0.85rem;
      vertical-align: super;
    }

    /* ── DIVIDER ────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 30px 0 4px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--stone), transparent);
    }
    .divider-icon { font-size: 14px; color: var(--stone); }

    /* ── INCLUDES ───────────────────────────────── */
    .includes {
      background: #fff;
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.05);
      margin-bottom: 28px;
    }

    .includes-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--green);
      margin-bottom: 10px;
    }

    .includes ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .includes li {
      font-size: 12.5px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .includes li::before {
      content: '✓';
      color: var(--green-lt);
      font-weight: 700;
      font-size: 13px;
    }

    /* ── CONTACT ────────────────────────────────── */
    .contact-block {
      background: linear-gradient(135deg, var(--green) 0%, #2A4A2A 100%);
      border-radius: var(--radius);
      padding: 24px 20px;
      color: #fff;
      text-align: center;
      margin-bottom: 28px;
    }

    .contact-block h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: rgba(255,255,255,0.92);
    }

    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: 13px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.10);
      border-radius: 8px;
      transition: background 0.2s;
    }

    .contact-link:hover, .contact-link:active {
      background: rgba(255,255,255,0.18);
    }

    .contact-link .icon { font-size: 16px; }

    /* ── FOOTER ─────────────────────────────────── */
    footer {
      background: var(--dark);
      color: rgba(255,255,255,0.45);
      text-align: center;
      font-size: 11px;
      padding: 18px 20px;
      letter-spacing: 0.04em;
    }

    footer a {
      color: var(--stone);
      text-decoration: none;
    }

    /* ── UNESCO BADGE ───────────────────────────── */
    .unesco-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(212,86,10,0.07);
      border: 1px solid rgba(212,86,10,0.15);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 12px;
      color: var(--orange);
      line-height: 1.4;
    }

    .unesco-badge .flag { font-size: 22px; flex-shrink: 0; }

    /* ── YEAR TAG ───────────────────────────────── */
    .year-tag {
      display: inline-block;
      background: var(--orange);
      color: #fff;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

  </style>
</head>
<body>

  <!-- HERO -->
  <div class="hero">

    <!--
      ══════════════════════════════════════════════════════
      FONDO DEL HERO

      AHORA (foto):
        Cambia "tu-foto.jpg" por el nombre de tu imagen.
        El archivo debe estar en la misma carpeta que el HTML.

      CUANDO TENGAS EL VÍDEO:
        Borra la línea del <img> y pon en su lugar:
        <video class="hero-bg" src="tu-video.mp4"
               autoplay muted loop playsinline></video>
      ══════════════════════════════════════════════════════
    -->
    <img
      class="hero-bg"
      src="FotoHotelMedulas.jpeg"
      alt="Hotel Medulio"
    />
    <div class="hero-badge" id="hero-badge">Las Médulas · Ponferrada</div>
    <h1>Hotel<br><span>Medulio</span></h1>
    <p class="hero-sub" id="hero-sub">Patrimonio de la Humanidad · UNESCO</p>
  </div>

  <!-- LANG SWITCHER -->
  <div class="lang-bar">
    <button class="lang-btn active" onclick="setLang('es')">🇪🇸 ES</button>
    <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
    <button class="lang-btn" onclick="setLang('fr')">🇫🇷 FR</button>
  </div>

  <!-- CONTENT -->
  <div class="section">

    <div class="section-title" id="title-offer"></div>
    <div class="section-sub" id="sub-offer"></div>

    <div style="text-align:center;">
      <span class="year-tag">2026</span>
    </div>

    <!-- PRICE CARDS -->
    <div class="cards" id="cards-container">

      <div class="card">
        <div class="card-icon">🎒</div>
        <div class="card-body">
          <div class="card-name" data-key="room1-name"></div>
          <div class="card-desc" data-key="room1-desc"></div>
        </div>
        <div class="card-price"><sup>€</sup>30</div>
      </div>

      <div class="card">
        <div class="card-icon">☀️</div>
        <div class="card-body">
          <div class="card-name" data-key="room2-name"></div>
          <div class="card-desc" data-key="room2-desc"></div>
        </div>
        <div class="card-price"><sup>€</sup>36</div>
      </div>

      <div class="card">
        <div class="card-icon">🍽️</div>
        <div class="card-body">
          <div class="card-name" data-key="room3-name"></div>
          <div class="card-desc" data-key="room3-desc"></div>
        </div>
        <div class="card-price"><sup>€</sup>50</div>
      </div>

      <div class="card">
        <div class="card-icon">⭐</div>
        <div class="card-body">
          <div class="card-name" data-key="room4-name"></div>
          <div class="card-desc" data-key="room4-desc"></div>
        </div>
        <div class="card-price"><sup>€</sup>62</div>
      </div>

    </div>

    <!-- INCLUDES -->
    <div class="divider"><span class="divider-icon">❧</span></div>

    <div class="includes">
      <div class="includes-title" id="includes-title"></div>
      <ul id="includes-list"></ul>
    </div>

    <!-- UNESCO -->
    <div class="unesco-badge">
      <span class="flag">🏔️</span>
      <span id="unesco-text"></span>
    </div>

    <!-- CONTACT -->
    <div class="contact-block">
      <h3 id="contact-title"></h3>
      <div class="contact-links">
        <a class="contact-link" href="tel:+34653554863">
          <span class="icon">📞</span> 653 554 863
        </a>
        <a class="contact-link" href="mailto:recepcionmedulio@gmail.com">
          <span class="icon">✉️</span> recepcionmedulio@gmail.com
        </a>
        <a class="contact-link" href="https://hotel-medulio.com" target="_blank">
          <span class="icon">🌐</span> hotel-medulio.com
        </a>
        <a class="contact-link" href="https://maps.google.com/?q=Las+Medulas,+Ponferrada" target="_blank">
          <span class="icon">📍</span> Las Médulas, Ponferrada
        </a>
      </div>
    </div>

  </div>

  <footer>
    &copy; 2026 Hotel Medulio · <a href="https://hotel-medulio.com">hotel-medulio.com</a>
  </footer>

  <script>
    const i18n = {
      es: {
        heroSub: 'Patrimonio de la Humanidad · UNESCO',
        titleOffer: 'Oferta Especial',
        subOffer: 'Precios por persona y noche · Temporada 2026',
        'room1-name': 'Hab. Peregrinos',
        'room1-desc': 'Habitación individual, alojamiento',
        'room2-name': 'Hab. con Desayuno',
        'room2-desc': 'Alojamiento + desayuno incluido',
        'room3-name': 'Media Pensión',
        'room3-desc': 'Alojamiento + desayuno + cena',
        'room4-name': 'Pensión Completa',
        'room4-desc': 'Alojamiento + todas las comidas',
        includesTitle: 'Todas las habitaciones incluyen',
        includesList: [
          'Baño completo privado',
          'Teléfono y televisión',
          'Terraza con vistas al paisaje',
          'Calefacción',
          'Aparcamiento gratuito',
        ],
        unescoText: 'Situado a la entrada de Las Médulas, Patrimonio de la Humanidad desde 1997. El mejor punto de partida para explorar el paraje.',
        contactTitle: '¿Quieres reservar?',
      },
      en: {
        heroSub: 'UNESCO World Heritage Site',
        titleOffer: 'Special Offer',
        subOffer: 'Prices per person per night · Season 2026',
        'room1-name': 'Pilgrim Room',
        'room1-desc': 'Single room, accommodation only',
        'room2-name': 'Room + Breakfast',
        'room2-desc': 'Accommodation + breakfast included',
        'room3-name': 'Half Board',
        'room3-desc': 'Accommodation + breakfast + dinner',
        'room4-name': 'Full Board',
        'room4-desc': 'Accommodation + all meals',
        includesTitle: 'All rooms include',
        includesList: [
          'Full private bathroom',
          'Telephone & television',
          'Terrace with landscape views',
          'Heating',
          'Free parking',
        ],
        unescoText: 'Located at the entrance of Las Médulas, a UNESCO World Heritage Site since 1997. The perfect base to explore this unique landscape.',
        contactTitle: 'Ready to book?',
      },
      fr: {
        heroSub: 'Patrimoine Mondial de l\'UNESCO',
        titleOffer: 'Offre Spéciale',
        subOffer: 'Prix par personne et par nuit · Saison 2026',
        'room1-name': 'Chambre Pèlerin',
        'room1-desc': 'Chambre individuelle, hébergement seul',
        'room2-name': 'Chambre + Petit-déjeuner',
        'room2-desc': 'Hébergement + petit-déjeuner inclus',
        'room3-name': 'Demi-pension',
        'room3-desc': 'Hébergement + petit-déjeuner + dîner',
        'room4-name': 'Pension Complète',
        'room4-desc': 'Hébergement + tous les repas',
        includesTitle: 'Toutes les chambres comprennent',
        includesList: [
          'Salle de bain privée complète',
          'Téléphone et télévision',
          'Terrasse avec vue sur le paysage',
          'Chauffage',
          'Parking gratuit',
        ],
        unescoText: 'Situé à l\'entrée de Las Médulas, Patrimoine Mondial de l\'UNESCO depuis 1997. Le meilleur point de départ pour explorer ce site unique.',
        contactTitle: 'Réserver maintenant ?',
      },
    };

    let currentLang = 'es';

    function setLang(lang) {
      currentLang = lang;
      const t = i18n[lang];

      document.documentElement.lang = lang;
      document.getElementById('hero-sub').textContent = t.heroSub;
      document.getElementById('title-offer').textContent = t.titleOffer;
      document.getElementById('sub-offer').textContent = t.subOffer;
      document.getElementById('includes-title').textContent = t.includesTitle;
      document.getElementById('contact-title').textContent = t.contactTitle;
      document.getElementById('unesco-text').textContent = t.unescoText;

      document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (t[key]) el.textContent = t[key];
      });

      const ul = document.getElementById('includes-list');
      ul.innerHTML = t.includesList.map(item => `<li>${item}</li>`).join('');

      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.lang-btn').forEach(btn => {
        if (btn.textContent.includes(lang.toUpperCase())) btn.classList.add('active');
      });

      // re-trigger card animations
      document.querySelectorAll('.card').forEach((c, i) => {
        c.style.animation = 'none';
        c.offsetHeight;
        c.style.animation = '';
        c.style.animationDelay = (0.05 + i * 0.07) + 's';
      });
    }

    // init
    setLang('es');
  </script>
</body>
</html>
